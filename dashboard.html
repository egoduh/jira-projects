<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд разработки — Jira</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Segoe UI, -apple-system, Roboto, sans-serif; margin: 0; background: #f5f6f8; color: #1a1a1a; }
  header { background: #0052cc; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; }
  header a { color: #cfe0ff; font-size: 13px; }
  .wrap { max-width: 1180px; margin: 20px auto; padding: 0 16px; }
  .bar { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px;
         background: #fff; padding: 14px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .bar label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
  select, input { padding: 8px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; }
  select[multiple] { min-width: 260px; height: 240px; }
  .selbox { font-size: 12px; margin-top: 4px; }
  .selbox a { color: #0052cc; cursor: pointer; }
  button { padding: 9px 18px; font-size: 14px; border: 0; border-radius: 6px; background: #0052cc; color: #fff; cursor: pointer; }
  button:hover { background: #0043a6; }
  .status { font-size: 13px; color: #555; margin-left: auto; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: #6b778c; margin: 26px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .card { background: #fff; border-radius: 8px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .card .v { font-size: 26px; font-weight: 700; }
  .card .l { font-size: 12px; color: #6b778c; margin-top: 2px; }
  .card .h { font-size: 11px; color: #97a0af; margin-top: 6px; }
  .card.na .v { color: #b3bac5; }
  .panel { background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #eee; }
  th { color: #6b778c; font-weight: 600; }
  .barrow { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 13px; }
  .barrow .track { flex: 1; background: #eef1f5; border-radius: 4px; height: 16px; overflow: hidden; }
  .barrow .fill { height: 100%; background: #0052cc; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
  .warn { color: #bf6a02; } .bad { color: #bf2600; } .ok { color: #0a7d33; }
  .err { background: #ffebe6; border: 1px solid #ff8f73; color: #bf2600; padding: 14px; border-radius: 8px; white-space: pre-wrap; }
  .muted { color: #97a0af; }
  svg { display: block; }
</style>
</head>
<body>
<header>
  <h1>Дашборд разработки</h1>
  <a href="/">← список проектов</a>
</header>
<div class="wrap">
  <div class="bar">
    <div>
      <label>Проекты (можно несколько)</label>
      <input id="projfilter" placeholder="фильтр по ключу/названию…" style="width:100%;margin-bottom:4px">
      <select id="projects" multiple></select>
      <div class="selbox"><a id="selall">выбрать всё</a> · <a id="selnone">сброс</a> · выбрано <span id="selcount">0</span></div>
    </div>
    <div>
      <label>Эталонный проект</label>
      <select id="refproj" style="min-width:200px"></select>
    </div>
    <div>
      <label>Окно, дней</label>
      <input id="days" type="number" value="90" min="7" max="365" style="width:90px">
    </div>
    <button id="load">Построить</button>
    <button id="workflow" style="background:#42526e">Сравнить воркфлоу</button>
    <button id="csv" style="background:#0a7d33" disabled title="доступно после сравнения">CSV</button>
    <span class="status" id="status"></span>
  </div>
  <div id="out"><p class="muted">Выбери проекты и нажми «Построить». Данные берутся из Jira по твоей сессии.</p></div>
</div>
<script>
const baseUrl = "__BASEURL__";
const $ = id => document.getElementById(id);
const out = $("out"), statusEl = $("status");

// ---------- утилиты ----------
function parseJira(s){ // "2026-08-10T12:34:56.000+0300" -> Date
  if(!s) return null;
  return new Date(s.replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
}
const DAY = 86400000;
function days(ms){ return ms/DAY; }
function pct(arr, p){
  if(!arr.length) return null;
  const a = arr.slice().sort((x,y)=>x-y);
  const i = Math.max(0, Math.ceil(p/100*a.length)-1);
  return a[i];
}
function fmtDays(ms){ return ms==null ? "—" : (days(ms)).toFixed(1)+" д"; }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function isoWeek(d){ // ключ недели YYYY-Www
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (t.getUTCDay()+6)%7; t.setUTCDate(t.getUTCDate()-day+3);
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(),0,4));
  const wk = 1 + Math.round(((t-firstThu)/DAY - 3 + ((firstThu.getUTCDay()+6)%7))/7);
  return t.getUTCFullYear()+"-W"+String(wk).padStart(2,"0");
}
// bug-подобные типы — для качества (bug-ratio), распределение же идёт по реальным типам
function isBug(name){ return /(баг|bug|дефект|defect|инцидент|incident|ошибк)/.test((name||"").toLowerCase()); }

// ---------- загрузка справочников ----------
let CATMAP = {}; // имя статуса -> new|indeterminate|done
async function loadStatuses(){
  const r = await fetch("/api/status");
  const data = await r.json();
  if(!r.ok) throw new Error(data.error || "не удалось получить /api/status");
  CATMAP = {};
  for(const s of data) CATMAP[s.name] = (s.statusCategory && s.statusCategory.key) || "new";
}
function cat(name){ return CATMAP[name] || "new"; }

let ALL_PROJECTS = [];               // [{key,name}]
const selectedKeys = new Set();      // авторитетный набор выбора (переживает фильтр)
let EXCLUDE = [];                    // шаблоны исключений из projects-exclude.txt
function isExcluded(key){ return EXCLUDE.some(p => p.endsWith("*") ? key.startsWith(p.slice(0,-1)) : key===p); }
async function loadExclude(){ try{ const r = await fetch("/api/exclude"); if(r.ok) EXCLUDE = await r.json(); }catch(e){} }

async function loadProjects(){
  await loadExclude();
  const r = await fetch("/api/projects");
  const data = await r.json();
  if(!r.ok){ out.innerHTML = '<div class="err">'+esc(data.error||"ошибка")+'</div>'; return; }
  ALL_PROJECTS = data.map(p=>({key:p.key, name:p.name})).filter(p=>!isExcluded(p.key)).sort((a,b)=>(a.key>b.key?1:-1));
  // эталон — все проекты, single select
  const ref = $("refproj");
  ref.innerHTML = ALL_PROJECTS.map(p=>`<option value="${esc(p.key)}">${esc(p.key)} — ${esc(p.name)}</option>`).join("");
  renderProjectOptions("");
}

function renderProjectOptions(filter){
  const f = (filter||"").trim().toLowerCase();
  const sel = $("projects");
  const list = ALL_PROJECTS.filter(p=> !f || p.key.toLowerCase().includes(f) || (p.name||"").toLowerCase().includes(f));
  sel.innerHTML = list.map(p=>`<option value="${esc(p.key)}"${selectedKeys.has(p.key)?" selected":""}>${esc(p.key)} — ${esc(p.name)}</option>`).join("");
  $("selcount").textContent = selectedKeys.size;
}

function syncSelectionFromVisible(){
  // видимые опции обновляют набор; скрытые фильтром выборы сохраняются
  const sel = $("projects");
  const visible = new Set([...sel.options].map(o=>o.value));
  const chosen = new Set([...sel.selectedOptions].map(o=>o.value));
  for(const k of visible){ if(chosen.has(k)) selectedKeys.add(k); else selectedKeys.delete(k); }
  $("selcount").textContent = selectedKeys.size;
}

function getSelectedKeys(){ return [...selectedKeys]; }

// ---------- выборка issues (бережно к Jira) ----------
const PAGE = 100;        // задач на страницу
const THROTTLE_MS = 200; // пауза между страницами — не бурстим Jira
const HARD_CAP = 3000;   // потолок: дальше не тянем историю
const CONFIRM_AT = 1500; // спросить подтверждение, если задач больше
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function jqlCount(jql){ // дешёвый префлайт: только total, без issues и без changelog
  const r = await fetch(`/api/search?jql=${encodeURIComponent(jql)}&maxResults=0&fields=key`);
  const d = await r.json();
  if(!r.ok) throw new Error(d.error || ("HTTP "+r.status));
  return d.total;
}

async function fetchIssues(keys, winDays){
  const jql = `project in (${keys.join(",")}) AND (statusCategory != Done OR resolved >= -${winDays}d) ORDER BY created ASC`;
  const fields = "summary,issuetype,status,created,resolutiondate,priority,attachment,issuelinks,subtasks,fixVersions";

  const total = await jqlCount(jql);
  if(total === 0) return { issues: [], total: 0, capped: false };
  const target = Math.min(total, HARD_CAP);
  if(total > CONFIRM_AT && !confirm(
      `В выборке ${total} задач. Загрузка с историей — это ~${Math.ceil(target/PAGE)} запросов к Jira `
      + `и заметная нагрузка. Продолжить?\n\nСовет: сузь набор проектов или уменьши окно.`)){
    throw new Error("Отменено. Сузь проекты или уменьши окно, чтобы не грузить Jira.");
  }

  let startAt = 0, issues = [], capped = false;
  while(startAt < target){
    const url = `/api/search?jql=${encodeURIComponent(jql)}&expand=changelog&fields=${fields}&startAt=${startAt}&maxResults=${PAGE}`;
    const r = await fetch(url);
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || ("HTTP "+r.status));
    const batch = data.issues || [];
    issues = issues.concat(batch);
    statusEl.textContent = `загружено ${issues.length} из ${target}…`;
    startAt += batch.length;
    if(batch.length === 0) break;
    if(issues.length >= HARD_CAP){ capped = true; break; }
    if(startAt < target) await sleep(THROTTLE_MS);
  }
  return { issues, total, capped };
}

// ---------- расчёт метрик по одной задаче ----------
function analyze(issue){
  const f = issue.fields;
  const created = parseJira(f.created);
  const resolved = parseJira(f.resolutiondate);
  const typeName = (f.issuetype && f.issuetype.name) || "—";
  const priority = (f.priority && f.priority.name) || "";
  const curCat = (f.status && f.status.statusCategory && f.status.statusCategory.key) || "new";

  // переходы статусов + смены типа из истории
  const trans = [], typeChanges = [];
  const hs = (issue.changelog && issue.changelog.histories) || [];
  for(const h of hs){
    for(const it of (h.items||[])){
      if(it.field === "status") trans.push({at: parseJira(h.created), from: it.fromString, to: it.toString});
      if(it.field === "issuetype") typeChanges.push({from: it.fromString, to: it.toString});
    }
  }
  trans.sort((a,b)=>a.at-b.at);

  let firstActive = null, doneAt = resolved;
  for(const t of trans){
    if(firstActive===null && cat(t.to)==="indeterminate") firstActive = t.at;
    if(cat(t.to)==="done") doneAt = doneAt || t.at;
  }
  if(firstActive===null && curCat==="indeterminate") firstActive = created; // создан сразу в работе
  const reopened = trans.some(t => cat(t.from)==="done" && cat(t.to)!=="done");

  // --- сигналы гейминга ---
  const bugReclass = typeChanges.some(t => isBug(t.from) && !isBug(t.to)); // баг → фича/задача
  const backward = trans.some(t => cat(t.from)==="indeterminate" && cat(t.to)==="new"); // стоп-кран In Progress→To Do
  const noActive = firstActive===null; // ни разу не был In Progress

  // тайминги в категориях для flow efficiency
  let activeMs = 0;
  if(trans.length){
    let prevCat = cat(trans[0].from) || "new", prevAt = created;
    for(const t of trans){
      if(prevCat==="indeterminate") activeMs += (t.at - prevAt);
      prevCat = cat(t.to); prevAt = t.at;
    }
    const end = doneAt || new Date();
    if(prevCat==="indeterminate") activeMs += (end - prevAt);
  }

  const lead = (doneAt && created) ? (doneAt - created) : null;
  const cycle = (doneAt && firstActive) ? (doneAt - firstActive) : null;
  const flowEff = (cycle && cycle>0) ? Math.min(1, activeMs/cycle) : null;
  const wipAge = (curCat==="indeterminate") ? ((new Date()) - (firstActive||created)) : null;

  // done-задача без реального времени в работе (cycle ~0 / пропущен In Progress)
  const cycleZero = !!doneAt && (noActive || (cycle!=null && cycle < 3600000));   // <1 часа
  const directToDone = !!doneAt && noActive;                                       // ни разу не In Progress
  const sameDay = !!(doneAt && created) && doneAt.toDateString()===created.toDateString();

  // этапы, через которые задача прошла (для воронки) + артефакты
  const seen = new Set();
  for(const t of trans){ if(t.from) seen.add(t.from); if(t.to) seen.add(t.to); }
  if(f.status && f.status.name) seen.add(f.status.name);
  const artAttach = (f.attachment||[]).length;
  const artLinks  = (f.issuelinks||[]).length;
  const artSub    = (f.subtasks||[]).length;
  const artFix    = (f.fixVersions||[]).length;

  return { key: issue.key, summary: f.summary, type: typeName, isBug: isBug(typeName), priority,
           statusName: f.status && f.status.name, curCat, created, doneAt,
           lead, cycle, flowEff, reopened, wipAge,
           bugReclass, backward, cycleZero, directToDone, sameDay,
           seen: [...seen], artAttach, artLinks, artSub, artFix };
}

// ---------- сводка ----------
function summarize(rows, winDays){
  const since = Date.now() - winDays*DAY;
  const done = rows.filter(r => r.doneAt && r.doneAt.getTime()>=since);
  const cycles = done.map(r=>r.cycle).filter(x=>x!=null && x>=0);
  const leads  = done.map(r=>r.lead).filter(x=>x!=null && x>=0);
  const flows  = done.map(r=>r.flowEff).filter(x=>x!=null);
  const wip = rows.filter(r=>r.curCat==="indeterminate");

  // throughput по неделям
  const weeks = {};
  for(const r of done){ const k = isoWeek(r.doneAt); weeks[k]=(weeks[k]||0)+1; }
  const weekKeys = Object.keys(weeks).sort();
  const thrVals = weekKeys.map(k=>weeks[k]);
  const thrAvg = thrVals.length ? thrVals.reduce((a,b)=>a+b,0)/thrVals.length : 0;

  // распределение мощности по РЕАЛЬНЫМ типам задач (История/Задача/Bug/…), по всем в окне
  const scope = done.concat(wip);
  const dist = {};
  for(const r of scope) dist[r.type] = (dist[r.type]||0)+1;

  const bugDone = done.filter(r=>r.isBug).length;
  const reopened = done.filter(r=>r.reopened).length;

  // --- здоровье метрик (детектор гейминга), с ключами задач как доказательствами ---
  const n = done.length || 1;
  const sig = (arr) => ({ n: arr.length, pct: arr.length/n, keys: arr.map(r=>r.key) });
  const sameDay      = sig(done.filter(r=>r.sameDay));
  const cycleZero    = sig(done.filter(r=>r.cycleZero));
  const directToDone = sig(done.filter(r=>r.directToDone));
  // смена типа и стоп-кран — по всем задачам (не только done)
  const bugReclass = { n: rows.filter(r=>r.bugReclass).length, keys: rows.filter(r=>r.bugReclass).map(r=>r.key), pct: rows.filter(r=>r.bugReclass).length/(rows.length||1) };
  const backward   = { n: rows.filter(r=>r.backward).length,   keys: rows.filter(r=>r.backward).map(r=>r.key),   pct: rows.filter(r=>r.backward).length/(rows.length||1) };
  // batch-закрытие: доля закрытий в самый пиковый день
  const byDay = {};
  for(const r of done){ const k = r.doneAt.toISOString().slice(0,10); byDay[k]=(byDay[k]||0)+1; }
  let batchDay=null, batchN=0; for(const k in byDay){ if(byDay[k]>batchN){batchN=byDay[k]; batchDay=k;} }
  const batch = { day: batchDay, n: batchN, pct: done.length ? batchN/done.length : 0 };
  const health = { sameDay, cycleZero, directToDone, bugReclass, backward, batch };

  // --- воронка этапов: сколько задач прошло через каждый статус (из истории) ---
  const funnel = {};
  for(const r of scope) for(const st of r.seen) funnel[st] = (funnel[st]||0)+1;
  // --- покрытие артефактами (эвристика: что дёшево тянется из Jira) ---
  const cov = pred => scope.length ? scope.filter(pred).length/scope.length : 0;
  const artifacts = {
    attach: cov(r=>r.artAttach>0), links: cov(r=>r.artLinks>0),
    sub: cov(r=>r.artSub>0), fix: cov(r=>r.artFix>0)
  };

  return {
    doneCount: done.length,
    cycleP50: pct(cycles,50), cycleP85: pct(cycles,85),
    leadP50: pct(leads,50), leadP85: pct(leads,85),
    flowEffMed: pct(flows,50),
    thrAvg, weeks, weekKeys,
    wip, wipCount: wip.length,
    dist, scopeCount: scope.length,
    bugRatio: done.length ? bugDone/done.length : null,
    reopenRate: done.length ? reopened/done.length : null,
    health, funnel, artifacts
  };
}

// ---------- рендер ----------
function card(c){ // c: {v,label,hint,tip,na}
  return `<div class="card${c.na?' na':''}" title="${esc(c.tip||'')}">
    <div class="v">${c.v}</div><div class="l">${c.label}</div>${c.hint?`<div class="h">${c.hint}</div>`:''}</div>`;
}
function svgBars(keys, vals){
  if(!keys.length) return '<p class="muted">нет данных</p>';
  const W=Math.max(keys.length*34,300), H=140, max=Math.max(...vals,1), bw=26, gap=8, base=H-22;
  let bars="";
  keys.forEach((k,i)=>{
    const h=Math.round((vals[i]/max)*(base-10)), x=i*(bw+gap)+8, y=base-h;
    bars += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="#0052cc" rx="2"><title>${k}: ${vals[i]}</title></rect>`;
    bars += `<text x="${x+bw/2}" y="${base+13}" font-size="9" fill="#97a0af" text-anchor="middle">${k.slice(-3)}</text>`;
    bars += `<text x="${x+bw/2}" y="${y-3}" font-size="10" fill="#42526e" text-anchor="middle">${vals[i]}</text>`;
  });
  return `<svg width="${W}" height="${H}">${bars}</svg>`;
}
function distBars(dist, total){
  const palette=["#0052cc","#bf2600","#bf6a02","#5243aa","#0a7d33","#00857a","#8777d9","#97a0af"];
  const keys=Object.keys(dist).sort((a,b)=>dist[b]-dist[a]);
  return keys.map((k,i)=>{
    const v=dist[k], p=total?Math.round(v/total*100):0;
    return `<div class="barrow"><span style="width:130px">${esc(k)}</span>
      <div class="track"><div class="fill" style="width:${p}%;background:${palette[i%palette.length]}"></div></div>
      <span style="width:70px;text-align:right">${v} · ${p}%</span></div>`;
  }).join("");
}

function render(s, meta){
  const effPct = s.flowEffMed!=null ? Math.round(s.flowEffMed*100)+"%" : "—";
  const bugR = s.bugRatio!=null ? Math.round(s.bugRatio*100)+"%" : "—";
  const reop = s.reopenRate!=null ? Math.round(s.reopenRate*100)+"%" : "—";

  const legend = `<details class="panel" style="margin-bottom:16px">
    <summary style="cursor:pointer;font-weight:600">❓ Как читать этот дашборд</summary>
    <div style="margin-top:10px;font-size:13px;line-height:1.6;color:#42526e">
      Все числа — за выбранное окно (${meta.days} дн), по задачам из твоей Jira.
      <b>Exec-сводка</b> отвечает на 4 вопроса руководителя:
      <br>• <b>Быстро ли везём?</b> — Cycle / Lead time (дни на задачу). <i>Меньше — лучше.</i>
      <br>• <b>Сколько везём?</b> — Throughput (задач/нед) и WIP (сколько в работе разом).
      <br>• <b>Качественно ли?</b> — Bug-ratio и Reopen rate. <i>Меньше — лучше.</i>
      <br>• <b>Эффективно ли?</b> — Flow efficiency (доля работы vs ожидания в очередях).
      <br><b>Операционка</b> ниже показывает, <b>где вмешаться</b>: что застряло, стабилен ли поток, куда уходит мощность.
      <br>Наведи курсор на любую карточку — там подробное пояснение.
      <br><br><span class="muted"><b>Заземление (первоисточники):</b> Lead time и Deployment frequency — Accelerate/SPACE (Larson «Технический директор», гл.6); Change failure rate — Wilson «Грокаем CD», гл.10.
      Cycle time / WIP / aging / flow efficiency — канон Kanban (вне этих книг). Throughput — сигнал потока, <b>не</b> мера продуктивности людей (предостережение SPACE).
      <br><b>Качество</b> (Грегори/Криспин «Больше Agile-тестирования»): bug share / reopen — вспомогательные сигналы; мерить по РИСКУ, не покрытие-как-цель; качество — дело всей команды, не «палка» на QA. Это не escape-rate в прод.
      <br><b>Надёжность</b> (Blank-Edelman / Савенкова): истинные MTTR / CFR / SLO требуют мониторинга, из Jira не берутся. Error budget = 1−SLO — инструмент баланса скорость/стабильность, <b>не</b> «разрешение ронять прод».</span>
    </div></details>`;

  const cards = [
    {v:fmtDays(s.cycleP50), label:"Cycle time · медиана", hint:"дней на задачу в работе",
     tip:"Сколько дней задача реально делается — от взятия в работу до готовности. Медиана: половина задач быстрее. Главный показатель скорости. Меньше — лучше."},
    {v:fmtDays(s.cycleP85), label:"Cycle time · 85%", hint:"реалистичный срок для бизнеса",
     tip:"85% задач готовы за это время. Именно это можно обещать заказчику как срок. Большой разрыв с медианой = непредсказуемость."},
    {v:s.thrAvg.toFixed(1), label:"Throughput · задач/нед", hint:"поток, НЕ продуктивность людей",
     tip:"Сколько задач команда закрывает в среднем за неделю — сигнал ПОТОКА/мощности. ВАЖНО: SPACE/Accelerate предостерегают мерить output как продуктивность — не ранжируй людей по throughput, задачи разного размера."},
    {v:fmtDays(s.leadP50), label:"Lead time · медиана", hint:"создано → готово",
     tip:"Дней от создания задачи до готовности, включая лежание в бэклоге. Разница с cycle time = сколько задача ждала, пока её взяли."},
    {v:String(s.wipCount), label:"WIP сейчас", hint:"задач в работе одновременно",
     tip:"Сколько задач в работе прямо сейчас. Много WIP при низком throughput = распыление: всё начато, ничего не доводится."},
    {v:effPct, label:"Flow efficiency", hint:"работа vs ожидание",
     tip:"Доля времени, когда над задачей реально работали, а не она ждала в очереди/на передаче. Норма 15–40%. Низко — главный резерв ускорения."},
    {v:bugR, label:"Bug share", hint:"доля багов среди закрытого",
     tip:"Доля багов среди закрытых задач — вспомогательный сигнал качества. Это НЕ Change Failure Rate (CFR = доля деплоев со сбоем, Wilson гл.10). По Грегори/Криспин качество мерят по РИСКУ (high-risk: деньги/логика должны быть покрыты), а не покрытием-как-целью. Настоящий CFR — в n/a."},
    {v:reop, label:"Reopen rate", hint:"переоткрыто после Done (rework)",
     tip:"Доля задач, вернувшихся из Done в работу — сигнал переделок и качества «с первого раза». По Грегори/Криспин качество — ответственность ВСЕЙ команды: не используй как «палку» на QA. Это НЕ escape-rate в прод (тот требует данных, ГДЕ найден дефект)."},
    {v:"n/a", label:"Deploy frequency", hint:"нужен CI/CD", na:true,
     tip:"Как часто выкатываем в прод (метрика DORA). Появится при подключении CI/CD."},
    {v:"n/a", label:"MTTR", hint:"нужны инциденты/мониторинг", na:true,
     tip:"Время ВОССТАНОВЛЕНИЯ сервиса после сбоя (DORA/SRE) — требует данных мониторинга, а не жизненного цикла тикета. Если инциденты тикетуются в Jira, можно добавить ПРОКСИ «время закрытия инцидент-тикета» + частоту инцидентов (честно как прокси, не истинный MTTR)."},
  ];
  const exec = `<h2>Exec-сводка</h2><div class="cards">${cards.map(card).join("")}</div>`;

  // ---- Здоровье метрик (детектор гейминга) ----
  const keyLink = k => baseUrl ? `<a href="${baseUrl}/browse/${k}" target="_blank" rel="noopener">${esc(k)}</a>` : esc(k);
  const evidence = keys => keys && keys.length
    ? `<details><summary class="muted" style="cursor:pointer;font-size:12px">показать ${keys.length} задач</summary>
       <div style="font-size:12px;margin-top:4px;line-height:1.7">${keys.slice(0,60).map(keyLink).join(", ")}${keys.length>60?` … (+${keys.length-60})`:''}</div></details>`
    : '';
  const stat = (pct, warnAt, badAt) => pct>=badAt?"bad":pct>=warnAt?"warn":"ok";
  const hrow = (name, valTxt, cls, expl, keys) => `<tr>
      <td>${name}</td>
      <td class="${cls}" style="font-weight:600;white-space:nowrap">${valTxt}</td>
      <td class="muted" style="font-size:12px">${expl}</td>
      <td>${evidence(keys)}</td></tr>`;
  const H = s.health, P = x => Math.round(x*100)+"%";
  const anyRed = [H.sameDay.pct,H.cycleZero.pct,H.directToDone.pct].some(p=>p>=0.3)
    || H.bugReclass.n>0 || H.backward.pct>=0.05 || H.batch.pct>=0.5;
  const healthRows = [
    hrow("Задача «одного дня»", `${H.sameDay.n} · ${P(H.sameDay.pct)}`, stat(H.sameDay.pct,0.15,0.30),
      "создана и закрыта в тот же день — признак позднего заведения тикета, cycle искусственно мал", H.sameDay.keys),
    hrow("Cycle ≈ 0 / нет работы", `${H.cycleZero.n} · ${P(H.cycleZero.pct)}`, stat(H.cycleZero.pct,0.15,0.30),
      "закрыта почти без времени в In Progress — клок не шёл, cycle не отражает труд", H.cycleZero.keys),
    hrow("Прыжок To Do → Done", `${H.directToDone.n} · ${P(H.directToDone.pct)}`, stat(H.directToDone.pct,0.10,0.25),
      "ни разу не была In Progress — пропуск рабочего статуса", H.directToDone.keys),
    hrow("Баг → фича/задача", `${H.bugReclass.n}`, H.bugReclass.n>0?(H.bugReclass.n>=3?"bad":"warn"):"ok",
      "тип менялся с бага на не-баг — прячет bug share и переделки (ты это видел)", H.bugReclass.keys),
    hrow("Стоп-кран (откат назад)", `${H.backward.n} · ${P(H.backward.pct)}`, stat(H.backward.pct,0.03,0.10),
      "возврат In Progress → To Do — остановка счётчика cycle", H.backward.keys),
    hrow("Batch-закрытие", H.batch.day?`${H.batch.n} за ${H.batch.day} · ${P(H.batch.pct)}`:"—", stat(H.batch.pct,0.30,0.50),
      "много закрытий в один день (часто конец спринта) — даты закрытия не отражают реальную готовность",
      null),
  ].join("");
  const healthPanel = `<h2>🕵 Здоровье метрик · детектор гейминга Lead/Cycle time</h2>
    <div class="panel" style="${anyRed?'border-left:4px solid #bf2600':'border-left:4px solid #0a7d33'}">
      <p style="margin:0 0 10px">${anyRed
        ? '<b class="bad">⚠ Метрики скорости искажены.</b> Ниже — приёмы и <b>конкретные задачи-доказательства</b> (кликабельны). Cycle/Lead time читать с поправкой; это защита твоей ответственности за KPI.'
        : '<b class="ok">✓ Явных признаков гейминга не видно</b> в этом окне. Но метрики скорости как KPI всё равно уязвимы — держи как диагностику.'}</p>
      <table><thead><tr><th>Приём</th><th>Замер</th><th>Что значит</th><th>Доказательства</th></tr></thead>
      <tbody>${healthRows}</tbody></table>
      <p class="muted" style="font-size:12px;margin:10px 0 0">Сигналы — инженерная интерпретация следов в changelog <i>[интерпретация]</i>. Принцип «не одна метрика, а мозаика; не делать метрику целью» — из грунта (Larson гл.6, SPACE). Устойчивое решение — <b>убрать Lead/Cycle из KPI</b>, оставить как диагностику в паре с качеством.</p>
    </div>`;

  const aging = s.wip.slice().sort((a,b)=>(b.wipAge||0)-(a.wipAge||0)).slice(0,12);
  const agingRows = aging.map(r=>{
    const d = r.wipAge!=null?days(r.wipAge):0;
    const cls = d>20?"bad":d>10?"warn":"";
    const link = baseUrl ? baseUrl+"/browse/"+r.key : "#";
    return `<tr><td><a href="${link}" target="_blank" rel="noopener">${esc(r.key)}</a></td>
      <td>${esc((r.summary||"").slice(0,55))}</td><td>${esc(r.type||"")}</td>
      <td>${esc(r.priority||"")}</td><td>${esc(r.statusName||"")}</td>
      <td class="${cls}" style="text-align:right">${d.toFixed(1)} д</td></tr>`;
  }).join("") || '<tr><td colspan="6" class="muted">нет задач в работе</td></tr>';

  // --- воронка этапов + артефакты ---
  const fCatOrder = {new:0, indeterminate:1, done:2};
  const fCatColor = {new:"#6b778c", indeterminate:"#0052cc", done:"#0a7d33"};
  const fCatName  = {new:"To Do", indeterminate:"In Progress", done:"Done"};
  const fStatuses = Object.keys(s.funnel).sort((a,b)=> (fCatOrder[cat(a)]-fCatOrder[cat(b)]) || (s.funnel[b]-s.funnel[a]));
  const fMax = Math.max(...Object.values(s.funnel), 1);
  const funnelBars = fStatuses.length ? fStatuses.map(st=>{
    const v = s.funnel[st], w = Math.round(v/fMax*100), c = cat(st);
    return `<div class="barrow"><span style="width:180px"><span class="pill" style="background:${fCatColor[c]};color:#fff">${fCatName[c]}</span> ${esc(st)}</span>
      <div class="track"><div class="fill" style="width:${w}%;background:${fCatColor[c]}"></div></div>
      <span style="width:50px;text-align:right;font-weight:600">${v}</span></div>`;
  }).join("") : '<p class="muted">нет данных</p>';
  const A = s.artifacts, pc = x => Math.round(x*100)+"%";
  const artRow = (label, val, tip) => `<tr><td>${label}</td><td style="text-align:right;font-weight:600">${pc(val)}</td><td class="muted" style="font-size:12px">${tip}</td></tr>`;

  const funnelPanel = `<h2>Воронка этапов разработки</h2>
    <div class="panel"><b>Сколько задач прошло через каждый этап</b> (за окно, ${s.scopeCount} задач).
      <span class="muted">Длина столбика = число задач, коснувшихся статуса. Сужение = drop-off между этапами.</span>
      ${funnelBars}</div>
    <div class="panel"><b>Артефакты этапов</b> — доля задач, у которых есть артефакт (эвристика из полей Jira).
      <table><thead><tr><th>Артефакт</th><th style="text-align:right">Покрытие</th><th>Что это</th></tr></thead><tbody>
      ${artRow("Вложения", A.attach, "прикреплённые файлы (макеты, доки, скриншоты)")}
      ${artRow("Связи", A.links, "issue links — связь с другими задачами / внешним (PR, спека)")}
      ${artRow("Подзадачи", A.sub, "декомпозиция задачи на шаги")}
      ${artRow("fixVersion", A.fix, "привязка к релизу — артефакт этапа деплоя")}
      </tbody></table>
      <p class="muted" style="font-size:12px;margin-top:8px">Пока это общая эвристика. Точную привязку «этап → его артефакт» (напр. «In Review обязан иметь PR-ссылку», «Testing — тест-подзадачи») настроим под ваши конвенции — скажи, чем у вас представлен артефакт каждого этапа.</p></div>`;

  const ops = `<h2>Операционка · где вмешаться</h2>
    ${funnelPanel}
    <div class="panel"><b>Throughput по неделям</b> — сколько задач закрывали каждую неделю.
      <span class="muted">Ровные столбики = предсказуемый поток; провалы/скачки = нестабильность.</span>
      ${svgBars(s.weekKeys, s.weekKeys.map(k=>s.weeks[k]))}</div>
    <div class="panel"><b>Aging WIP</b> — задачи, дольше всего висящие в работе.
      <span class="muted">Сверху самые «протухшие». <span class="warn">жёлтое &gt;10 дн</span>, <span class="bad">красное &gt;20 дн</span> — кандидаты «разберись, почему стоит».</span>
      <table><thead><tr><th>Ключ</th><th>Тема</th><th>Тип</th><th>Приоритет</th><th>Статус</th><th style="text-align:right">Возраст</th></tr></thead>
      <tbody>${agingRows}</tbody></table></div>
    <div class="panel"><b>Куда уходит мощность</b> — распределение по типам задач за окно (${s.scopeCount} шт).
      <span class="muted">Показывает баланс: новое (История/Задача) vs исправления (Bug) vs долг.</span>
      ${distBars(s.dist, s.scopeCount)}</div>`;

  const note = `<p class="muted" style="margin-top:18px">Окно ${meta.days} дн · закрыто ${s.doneCount} задач · всего в выборке ${meta.total}${meta.capped?' · ⚠ обрезано до 3000, сузь проекты/окно':''}.
    Deploy frequency / MTTR / настоящий CFR появятся при подключении CI/CD и системы инцидентов.</p>`;

  out.innerHTML = legend + exec + healthPanel + ops + note;
}

// ---------- запуск ----------
async function run(){
  const keys = getSelectedKeys();
  if(!keys.length){ out.innerHTML = '<div class="err">Выбери хотя бы один проект.</div>'; return; }
  const winDays = Math.max(7, parseInt($("days").value)||90);
  out.innerHTML = '<p class="muted">Загрузка и расчёт…</p>'; statusEl.textContent = "";
  try{
    if(!Object.keys(CATMAP).length) await loadStatuses();
    const { issues, total, capped } = await fetchIssues(keys, winDays);
    statusEl.textContent = `обработка ${issues.length}…`;
    const rows = issues.map(analyze);
    const s = summarize(rows, winDays);
    render(s, { days: winDays, total, capped });
    statusEl.textContent = "готово";
  }catch(e){
    out.innerHTML = '<div class="err">'+esc(e.message)+'</div>'; statusEl.textContent = "";
  }
}
// ---------- сравнение воркфлоу ----------
async function projectStatuses(key){
  const r = await fetch("/api/project-statuses?key="+encodeURIComponent(key));
  const d = await r.json();
  if(!r.ok) throw new Error(d.error || ("HTTP "+r.status));
  return d; // массив типов задач, у каждого .statuses[]
}

let LAST_WF = null; // для CSV-экспорта

async function compareWorkflows(){
  let keys = getSelectedKeys();
  const ref = $("refproj").value;
  if(!keys.length){ out.innerHTML = '<div class="err">Выбери хотя бы один проект.</div>'; return; }
  if(ref && !keys.includes(ref)) keys = [ref, ...keys];   // эталон всегда в сравнении
  out.innerHTML = '<p class="muted">Сравниваю воркфлоу…</p>'; statusEl.textContent = "";
  try{
    const perProject = {}; // key -> Map(statusName -> categoryKey)
    let i = 0;
    for(const k of keys){
      const types = await projectStatuses(k);
      const m = new Map();
      for(const t of (types||[])) for(const s of (t.statuses||[])) m.set(s.name, (s.statusCategory&&s.statusCategory.key)||"new");
      perProject[k] = m;
      statusEl.textContent = `получено ${++i}/${keys.length}`;
      if(i < keys.length) await sleep(80);   // лёгкий троттлинг на 90 проектах
    }
    LAST_WF = { perProject, keys, ref };
    renderWorkflow(perProject, keys, ref);
    $("csv").disabled = false;
    statusEl.textContent = "готово";
  }catch(e){
    out.innerHTML = '<div class="err">'+esc(e.message)+'</div>'; statusEl.textContent = "";
  }
}

// соответствие проекта эталону: совпавшие/пропущенные/лишние статусы
function conformance(perProject, key, ref){
  const R = perProject[ref], P = perProject[key];
  if(!R || !P) return null;
  const missing = [...R.keys()].filter(s=>!P.has(s));   // есть у эталона, нет у проекта
  const extra   = [...P.keys()].filter(s=>!R.has(s));   // есть у проекта, нет у эталона
  const matched = R.size - missing.length;
  return { pct: R.size ? matched/R.size : 1, matched, missing, extra };
}

function renderWorkflow(perProject, keys, ref){
  const catOrder = {new:0, indeterminate:1, done:2};
  const catColor = {new:"#6b778c", indeterminate:"#0052cc", done:"#0a7d33"};
  const catName  = {new:"To Do", indeterminate:"In Progress", done:"Done"};
  const cat = new Map(), catConflict = new Set();
  for(const k of keys) for(const [name,c] of perProject[k]){
    if(cat.has(name) && cat.get(name)!==c) catConflict.add(name);
    if(!cat.has(name)) cat.set(name, c);
  }
  const statuses = [...cat.keys()].sort((a,b)=> (catOrder[cat.get(a)]-catOrder[cat.get(b)]) || (a<b?-1:1));
  const sig = k => [...perProject[k].keys()].sort().join("|");
  const same = new Set(keys.map(sig)).size === 1;

  // --- итог соответствия эталону ---
  let confBlock = "", confAvg = null, fullMatch = 0;
  if(ref && perProject[ref]){
    const others = keys.filter(k=>k!==ref);
    const confs = others.map(k=>({k, c:conformance(perProject,k,ref)})).filter(x=>x.c);
    confAvg = confs.length ? confs.reduce((a,x)=>a+x.c.pct,0)/confs.length : 1;
    fullMatch = confs.filter(x=>x.c.pct===1 && x.c.extra.length===0).length;
    const rowsC = confs.sort((a,b)=>a.c.pct-b.c.pct).map(x=>{
      const p = Math.round(x.c.pct*100), cls = p>=100&&x.c.extra.length===0?"ok":p>=80?"warn":"bad";
      return `<tr><td>${esc(x.k)}</td>
        <td class="${cls}" style="font-weight:600;text-align:right">${p}%</td>
        <td class="muted" style="font-size:12px">${x.c.missing.length?"нет: "+x.c.missing.map(esc).join(", "):"—"}</td>
        <td class="muted" style="font-size:12px">${x.c.extra.length?"лишние: "+x.c.extra.map(esc).join(", "):"—"}</td></tr>`;
    }).join("");
    confBlock = `<h2 style="margin-top:20px">Соответствие эталону «${esc(ref)}»</h2>
      <div class="panel">
        <p style="margin:0 0 10px">Среднее соответствие: <b class="${confAvg>=0.9?'ok':confAvg>=0.7?'warn':'bad'}">${Math.round(confAvg*100)}%</b>
          · полностью совпадают с эталоном: <b>${fullMatch}/${others.length}</b></p>
        <table><thead><tr><th>Проект</th><th style="text-align:right">Соответствие</th><th>Отличия от эталона</th><th></th></tr></thead>
        <tbody>${rowsC || '<tr><td colspan="4" class="muted">нет других проектов для сравнения</td></tr>'}</tbody></table>
      </div>`;
  }

  const header = keys.map(k=>`<th style="text-align:center">${esc(k)}${k===ref?' ★':''}</th>`).join("");
  let rows = "";
  for(const st of statuses){
    const c = cat.get(st);
    const cells = keys.map(k => perProject[k].has(st)
      ? '<td style="text-align:center;color:#0a7d33">✓</td>'
      : '<td style="text-align:center;color:#ccc">–</td>').join("");
    const universal = keys.every(k=>perProject[k].has(st));
    const conflict = catConflict.has(st) ? ' <span class="bad" style="font-size:11px">категория различается!</span>' : '';
    const flag = universal ? '' : '<td class="warn" style="font-size:11px">не у всех</td>';
    rows += `<tr><td><span class="pill" style="background:${catColor[c]};color:#fff">${catName[c]}</span> ${esc(st)}${conflict}</td>${cells}${same?'':flag}</tr>`;
  }
  const verdict = same
    ? `<b class="ok">✓ Воркфлоу одинаковый</b> — у всех ${keys.length} проектов один набор из ${statuses.length} статусов. Метрики можно считать одной меркой и агрегировать.`
    : `<b class="bad">⚠ Воркфлоу различаются</b> — наборы статусов не совпадают. Cycle time и health-детектор надо считать <b>по-проектно</b>, агрегировать осторожно.`;
  out.innerHTML = `<h2>Сравнение воркфлоу (${keys.length} проектов)</h2>
    <div class="panel" style="border-left:4px solid ${same?'#0a7d33':'#bf2600'}">
      <p style="margin:0 0 10px">${verdict}</p>
      <div style="overflow:auto;max-height:60vh"><table><thead><tr><th style="position:sticky;left:0;background:#fafbfc">Статус (категория)</th>${header}${same?'':'<th></th>'}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="muted" style="font-size:12px;margin-top:10px">Категории: <span style="color:#6b778c">To Do</span> · <span style="color:#0052cc">In Progress</span> · <span style="color:#0a7d33">Done</span>.
      «категория различается» = один статус отнесён к разным категориям (искажает cycle time). ★ = эталон. Кнопка CSV — экспорт матрицы. Источник: GET /rest/api/2/project/{key}/statuses.</p>
    </div>${confBlock}`;
}

// экспорт матрицы воркфлоу в CSV (Excel-совместимый, UTF-8 BOM)
function exportWorkflowCsv(){
  if(!LAST_WF){ return; }
  const { perProject, keys, ref } = LAST_WF;
  const cat = new Map();
  for(const k of keys) for(const [name,c] of perProject[k]) if(!cat.has(name)) cat.set(name, c);
  const catName = {new:"To Do", indeterminate:"In Progress", done:"Done"};
  const q = s => '"' + String(s).replace(/"/g,'""') + '"';
  const head = ["Статус","Категория", ...keys.map(k=> k===ref? k+" (эталон)" : k)];
  const lines = [head.map(q).join(",")];
  for(const [st,c] of cat){
    lines.push([q(st), q(catName[c]||c), ...keys.map(k=> perProject[k].has(st) ? q("да") : q(""))].join(","));
  }
  // блок соответствия
  if(ref && perProject[ref]){
    lines.push(""); lines.push(q("Соответствие эталону "+ref));
    lines.push(["Проект","Соответствие %","Нет (vs эталон)","Лишние"].map(q).join(","));
    for(const k of keys.filter(x=>x!==ref)){
      const cf = conformance(perProject,k,ref); if(!cf) continue;
      lines.push([q(k), q(Math.round(cf.pct*100)), q(cf.missing.join("; ")), q(cf.extra.join("; "))].join(","));
    }
  }
  const blob = new Blob(["﻿"+lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "workflow-compare.csv";
  document.body.appendChild(a); a.click(); a.remove();
}

$("load").addEventListener("click", run);
$("workflow").addEventListener("click", compareWorkflows);
$("csv").addEventListener("click", exportWorkflowCsv);
$("projects").addEventListener("change", syncSelectionFromVisible);
$("projfilter").addEventListener("input", e => renderProjectOptions(e.target.value));
$("selall").addEventListener("click", () => {   // выбрать всё, что видно под фильтром
  for(const o of $("projects").options) selectedKeys.add(o.value);
  renderProjectOptions($("projfilter").value);
});
$("selnone").addEventListener("click", () => { selectedKeys.clear(); renderProjectOptions($("projfilter").value); });
loadProjects();
</script>
